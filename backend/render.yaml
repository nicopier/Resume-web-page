services:
  - type: web
    name: resume-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scripts.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://resume-web-page-lake.vercel.app
      - key: FRONTEND_URL
        value: https://resume-web-page-lake.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://resume-web-page-lake.vercel.app
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: resume-db
    databaseName: resume_app
    user: resume_user
    plan: free
