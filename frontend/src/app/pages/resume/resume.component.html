<div class="resume-page">

  <!-- Header -->
  <div class="page-header">
    <h2 i18n>Mis CVs</h2>
    <a class="btn-new" [routerLink]="['/resume/new']" i18n>+ Crear nuevo</a>
  </div>

  @if (loading()) {
    <p class="status" i18n>Cargando...</p>
  } @else if (data().length === 0) {
    <div class="empty-state">
      <div class="empty-icon">📄</div>
      <p i18n>Todavía no creaste ningún CV.</p>
      <a class="btn-new" [routerLink]="['/resume/new']" i18n>Crear mi primer CV</a>
    </div>
  } @else {
    <div class="table-wrap">
      <table mat-table [dataSource]="data()">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef i18n>CV</th>
          <td mat-cell *matCellDef="let r">
            <span class="cv-id">#{{ r.id }}</span>
          </td>
        </ng-container>

        <!-- Actualizado -->
        <ng-container matColumnDef="updated">
          <th mat-header-cell *matHeaderCellDef i18n>Última edición</th>
          <td mat-cell *matCellDef="let r">
            <span class="date-text">{{ r.updated_at | date:'dd/MM/yyyy' }}</span>
          </td>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef i18n>Acciones</th>
          <td mat-cell *matCellDef="let r">
            <div class="row-actions">
              <button class="btn-action edit" (click)="editar(r.id)" i18n>
                <mat-icon>edit</mat-icon> Editar
              </button>
              <button class="btn-action download" (click)="descargar(r.id)" i18n>
                <mat-icon>download</mat-icon> Descargar
              </button>
              <button class="btn-action delete" (click)="eliminar(r.id)" i18n>
                <mat-icon>delete</mat-icon> Eliminar
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }

</div>
